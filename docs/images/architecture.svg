<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="510" viewBox="0 0 1100 510" role="img" aria-label="Two VM monitoring lab architecture">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#36536f"/></marker></defs>
<rect width="1100" height="510" fill="#f5f7fa"/><g font-family="Arial,sans-serif" fill="#172739">
<text x="40" y="45" font-size="26" font-weight="bold">Remote station monitoring lab</text>
<rect x="35" y="85" width="445" height="290" rx="12" fill="white" stroke="#829ab0"/><text x="55" y="117" font-size="21" font-weight="bold">outdoor-vm</text>
<text x="55" y="151" font-size="17">Simulated sensor A → persistent queue A</text><text x="55" y="186" font-size="17">Simulated sensor B → persistent queue B</text>
<text x="55" y="230" font-size="16">Save first · Retry · Remove after acknowledgement</text>
<path d="M250 250 V280" stroke="#36536f" stroke-width="2" marker-end="url(#arrow)"/><rect x="55" y="285" width="400" height="65" rx="6" fill="#eaf0f6"/><text x="70" y="311" font-size="17">Separate backup disk</text><text x="70" y="335" font-size="15">Periodic SQLite snapshots · Three per sensor</text>
<path d="M480 175 H640" stroke="#36536f" stroke-width="2" marker-end="url(#arrow)"/><text x="500" y="146" font-size="16">HTTPS 8443</text><text x="500" y="205" font-size="15">Private network</text>
<rect x="650" y="85" width="415" height="290" rx="12" fill="white" stroke="#829ab0"/><text x="670" y="117" font-size="21" font-weight="bold">monitor-vm</text><text x="670" y="165" font-size="18">Collector → SQLite readings</text><text x="670" y="199" font-size="16">Unique IDs prevent duplicate storage</text><text x="670" y="253" font-size="18">Dashboard: localhost:8080</text><text x="670" y="285" font-size="16">Counts · Freshness · Last-reported queue</text>
<path d="M855 375 V421" stroke="#36536f" stroke-width="2" marker-end="url(#arrow)"/><text x="700" y="452" font-size="18">Your browser through an SSH tunnel</text>
<text x="40" y="418" font-size="15">Both sensors share one VM, power and network.</text><text x="40" y="445" font-size="15">Backup snapshots have a recovery gap; this is not mirroring.</text><text x="40" y="480" font-size="15">Conceptual design only. Replace with your actual configuration in the report.</text></g></svg>
